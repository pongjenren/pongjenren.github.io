<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>圖片重疊</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      padding: 24px;
    }

    .stage {
      position: relative;
      width: 952px;
      height: 1719px;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
      background: #eee;
    }

    /* 背景圖：填滿即可，超出上傳圖沒關係 */
    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;   /* 背景可裁切 */
      object-position: center;
    }

    /* 上傳圖：不裁切、不變形 */
    .overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain; /* 關鍵 */
      object-position: center;
      opacity: 0.5;        /* 50% 透明度 */
      display: none;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <input type="file" id="fileInput" accept="image/*">

  <div style="height: 16px;"></div>

  <div class="stage">
    <!-- 預設背景圖 -->
    <img src="./media/energy_background.jpg" class="bg" alt="background">

    <!-- 使用者上傳圖 -->
    <img id="overlayImg" class="overlay" alt="overlay">
  </div>

  <script>
    const input = document.getElementById("fileInput");
    const overlayImg = document.getElementById("overlayImg");

    let url = null;

    input.addEventListener("change", () => {
      const file = input.files[0];
      if (!file) return;

      if (url) URL.revokeObjectURL(url);
      url = URL.createObjectURL(file);

      overlayImg.src = url;
      overlayImg.style.display = "block";
    });
  </script>
</body>
</html>
