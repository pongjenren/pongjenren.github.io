<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>圖片重疊</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      padding: 24px;
    }

    /* 上方控制列 */
    .controls {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 16px;
    }

    .stage {
      position: relative;
      width: 952px;
      height: 1719px;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
      background: #eee;
    }

    /* 背景圖 */
    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    /* 上傳圖 */
    .overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      opacity: 0.5;      /* 預設 50% */
      display: none;
      pointer-events: none;
    }

    .upload-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: 300px;
      height: 100px;

      background: #ffffff;
      border: 2px solid #333;
      border-radius: 12px;

      font-size: 40px;
      cursor: pointer;
      user-select: none;

      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .upload-btn:hover {
      background: #f3f3f3;
    }

    /* Slider 區 */
    .opacity-control {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 520px;
      font-size: 50px;
    }

    .opacity-control input[type="range"] {
      width: 500px;   /* 原本 220px，放大顯示比例 */
      height: 12px;    /* 有些瀏覽器會吃這個 */
    }

    .opacity-control label {
      font-size: 35px;
      color: #333;
    }


  </style>
</head>

<body>
  <input type="file" id="fileInput" accept="image/*" hidden>

  <div class="controls">
    <label for="fileInput" class="upload-btn">
      上傳圖片
    </label>

    <div class="opacity-control">
      <label>
        透明度：<span id="opacityValue">50%</span>
      </label>
      <input
        type="range"
        id="opacitySlider"
        min="0"
        max="100"
        value="50"
      >
    </div>
  </div>

  <div class="stage">
    <!-- 預設背景圖 -->
    <img src="./media/energy_background.jpg" class="bg" alt="background">

    <!-- 使用者上傳圖 -->
    <img id="overlayImg" class="overlay" alt="overlay">
  </div>

  <script>
    const input = document.getElementById("fileInput");
    const overlayImg = document.getElementById("overlayImg");
    const slider = document.getElementById("opacitySlider");
    const opacityValue = document.getElementById("opacityValue");

    let url = null;

    // 上傳圖片
    input.addEventListener("change", () => {
      const file = input.files[0];
      if (!file) return;

      if (url) URL.revokeObjectURL(url);
      url = URL.createObjectURL(file);

      overlayImg.src = url;
      overlayImg.style.display = "block";
    });

    // 透明度調整
    slider.addEventListener("input", () => {
      const alpha = slider.value / 100;
      overlayImg.style.opacity = alpha;
      opacityValue.textContent = `${slider.value}%`;
    });
  </script>
</body>
</html>
